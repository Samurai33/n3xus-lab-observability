# MKTXP device config. Copy into the MKTXP config dir (the container mounts ./mktxp at /home/mktxp/mktxp).
# Read-only user over API-SSL, certificate pinned to your own CA. See mktxp/README.md for the RouterOS side.
[router]
    hostname = 192.0.2.1
    port = 8729
    credentials_file = /home/mktxp/mktxp/credentials.yaml
    use_ssl = True
    ssl_certificate_verify = True
    ssl_check_hostname = True
    ssl_ca_file = /home/mktxp/mktxp/router-ca.pem
    routerboard = True
    wireguard_peers = True
    certificate = True
    wireless = False
    wireless_clients = False
    capsman = False
    capsman_clients = False
    check_for_updates = False

[default]

    enabled = True
    module_only = False
    hostname = localhost
    port = 8728
    username = username
    password = password
    credentials_file = ""
    custom_labels = None
    use_ssl = False
    no_ssl_certificate = False
    ssl_certificate_verify = False
    ssl_check_hostname = True
    ssl_ca_file = ""
    plaintext_login = True
    health = True
    installed_packages = True
    dhcp = True
    dhcp_lease = True
    connections = True
    connection_stats = False
    connection_stats_destinations = False
    interface = True
    interface_with_default_name = False
    routerboard = False
    wireguard_peers = False
    bridge_vlan = False
    route = True
    pool = True
    firewall = True
    neighbor = True
    address_list = None
    total_address_list_counts = True
    dns = False
    ipv6_route = False
    ipv6_pool = False
    ipv6_firewall = False
    ipv6_neighbor = False
    ipv6_address_list = None
    ipv6_total_address_list_counts = True
    poe = True
    monitor = True
    netwatch = True
    public_ip = True
    wireless = True
    wireless_clients = True
    capsman = True
    capsman_clients = True
    w60g = False
    eoip = False
    gre = False
    ipip = False
    lte = False
    ipsec = False
    switch_port = False
    kid_control_assigned = False
    kid_control_dynamic = False
    user = True
    queue = True
    bfd = False
    bgp = False
    routing_stats = False
    certificate = False
    container = False
    remote_dhcp_entry = None
    remote_capsman_entry = None
    interface_name_format = name



    check_for_updates = False
