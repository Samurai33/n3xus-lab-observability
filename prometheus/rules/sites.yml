groups:
  - name: sites
    rules:
      - alert: SiteDown
        expr: probe_success{job="sites"} == 0
        for: 3m
        # per-target severity: set severity_hint on the target (critical for your own sites, warning for others)
        labels: { severity: "{{ $labels.severity_hint }}" }
        annotations: { summary: "{{ $labels.instance }} ({{ $labels.group }}) down for 3 min" }

      - alert: CertificateExpiring
        expr: (probe_ssl_earliest_cert_expiry{job="sites"} - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Certificate of {{ $labels.instance }} expires in {{ $value | humanize }} days" }
